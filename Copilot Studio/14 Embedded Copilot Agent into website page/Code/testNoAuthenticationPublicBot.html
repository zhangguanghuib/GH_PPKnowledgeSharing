<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Demo ChatBot</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
    <script>
		let webChatInstance = null;
		let directLineUrl = null;
		
		// Replace <tokenEndpoint> with your actual token endpoint URL from Copilot Studio=>Channels=>Line, Copy "Token Point"
		const tokenEndpoint = "<tokenEndpoint>";
		
		const styleOptions = {
			accent: '#012056',
			botAvatarBackgroundColor: '#F0EBEB',
			"hideUploadButton":true,
			"bubbleImageHeight":10,
			"bubbleImageMaxHeight":240,
			"bubbleImageMinHeight":240,
			"fontSizeSmall":"70%",
			"monospaceFont":"Consolas",
			"paddingRegular":10,
			"paddingWide":10,
			"sendBoxMaxHeight":120,
			"sendBoxTextWrap":true,
			"typingAnimationDuration":5000,
			"typingAnimationHeight":20,
			"typingAnimationWidth":64
		};
		const styleOptions_old = {"accent":"#0078D4","autoScrollSnapOnPage":true,"autoScrollSnapOnPageOffset":0,"avatarBorderRadius":"7%","avatarSize":31,"backgroundColor":"#e8e9eb","botAvatarBackgroundColor":"#ffffff00","botAvatarImage":"https://powercatexternal.blob.core.windows.net/creatorkit/Assets/ChatbotLogoBlue.png","botAvatarInitials":"B","bubbleAttachmentMaxWidth":480,"bubbleAttachmentMinWidth":250,"bubbleBackground":"#f0eded","bubbleBorderColor":"#f5f5f5","bubbleBorderRadius":41,"bubbleBorderStyle":"solid","bubbleBorderWidth":1,"bubbleFromUserBackground":"#ebefff","bubbleFromUserBorderColor":"#f5f5f5","bubbleFromUserBorderRadius":41,"bubbleFromUserBorderStyle":"solid","bubbleFromUserBorderWidth":1,"bubbleFromUserNubOffset":0,"bubbleFromUserNubSize":0,"bubbleFromUserTextColor":"#242424","bubbleImageHeight":10,"bubbleImageMaxHeight":240,"bubbleImageMinHeight":240,"bubbleMessageMaxWidth":480,"bubbleMessageMinWidth":120,"bubbleMinHeight":50,"bubbleNubOffset":0,"bubbleTextColor":"#242424","emojiSet":true,"fontSizeSmall":"70%","hideUploadButton":false,"messageActivityWordBreak":"break-word","monospaceFont":"Consolas","paddingRegular":10,"paddingWide":10,"primaryFont":null,"sendBoxBackground":"#e8e9eb","sendBoxBorderTop":"solid 1px #808080","sendBoxButtonColor":"#0078d4","sendBoxButtonColorOnHover":"#006cbe","sendBoxButtonShadeBorderRadius":40,"sendBoxButtonShadeColorOnHover":"","sendBoxHeight":60,"sendBoxPlaceholderColor":"#171616","sendBoxTextColor":"#2e2d2d","showAvatarInGroup":"status","spinnerAnimationHeight":16,"spinnerAnimationPadding":12,"spinnerAnimationWidth":16,"subtleColor":"#000000FF","suggestedActionBackgroundColor":"#006FC4FF","suggestedActionBackgroundColorOnHover":"#0078D4","suggestedActionBorderColor":"","suggestedActionBorderRadius":10,"suggestedActionBorderWidth":1,"suggestedActionLayout":"flow","suggestedActionTextColor":"#FFFFFFFF","typingAnimationBackgroundImage":"url('https://wpamelia.com/wp-content/uploads/2018/11/ezgif-2-6d0b072c3d3f.gif')","typingAnimationDuration":5000,"typingAnimationHeight":20,"typingAnimationWidth":64,"userAvatarBackgroundColor":"#222222","userAvatarImage":"https://avatars.githubusercontent.com/u/8174072?v=4&size=64","userAvatarInitials":"U"};
		const backgroundImage = "";
		document.addEventListener('DOMContentLoaded', () => {
			const root = document.documentElement;
			root.style.setProperty('--primary-color', createGradient(styleOptions.accent));
			root.style.setProperty('--header-textColor', styleOptions.suggestedActionTextColor);
			if (backgroundImage) {
				const webchatElement = document.getElementById('webchat');
				webchatElement.style.backgroundImage = `url(${backgroundImage})`;
				webchatElement.style.backgroundSize = 'cover';
				webchatElement.style.backgroundPosition = 'center';
				webchatElement.style.backgroundRepeat = 'no-repeat';
				const overlay = document.createElement('div');
				overlay.className = 'webchat-overlay';
				webchatElement.appendChild(overlay);
			}
		});
		function createGradient(baseColor) {
			const r = parseInt(baseColor.slice(1,3), 16);
			const g = parseInt(baseColor.slice(3,5), 16);
			const b = parseInt(baseColor.slice(5,7), 16);
			const lighterColor = `#${Math.min(255, r+30).toString(16).padStart(2,'0')}${Math.min(255, g+30).toString(16).padStart(2,'0')}${Math.min(255, b+30).toString(16).padStart(2,'0')}`;
			const darkerColor = `#${Math.max(0, r-30).toString(16).padStart(2,'0')}${Math.max(0, g-30).toString(16).padStart(2,'0')}${Math.max(0, b-30).toString(16).padStart(2,'0')}`;
			return `linear-gradient(135deg, ${lighterColor}, ${baseColor}, ${darkerColor})`;
		}
		const environmentEndPoint = tokenEndpoint.slice(0, tokenEndpoint.indexOf("/powervirtualagents"));
		const apiVersion = tokenEndpoint
		.slice(tokenEndpoint.indexOf("api-version"))
		.split("=")[1];
		const regionalChannelSettingsURL = `${environmentEndPoint}/powervirtualagents/regionalchannelsettings?api-version=${apiVersion}`;
		function showChat() {
			const popup = document.getElementById("chatbot-popup");
			const openButton = document.getElementById("open-chat");
			popup.classList.add("visible");
			openButton.classList.add("hidden");
			if (!webChatInstance) {
				initializeChat();
			}
		}
		function hideChat() {
			const popup = document.getElementById("chatbot-popup");
			const openButton = document.getElementById("open-chat");
			popup.classList.remove("visible");
			openButton.classList.remove("hidden");
		}
		function createCustomStore() {
			return window.WebChat.createStore(
				{},
				({ dispatch }) =>
				(next) =>
				(action) => {
				if (action.type === "DIRECT_LINE/CONNECT_FULFILLED") {
					dispatch({
						type: "DIRECT_LINE/POST_ACTIVITY",
						meta: { method: "keyboard" },
						payload: {
						activity: {
						channelData: { postBack: true },
						name: "startConversation",
						type: "event",
						},
						},
					});
				}
				return next(action);
				}
			);
		}
		async function restartConversation() {
			try {
				if (!directLineUrl) {
					console.error("DirectLine URL not initialized");
					return;
				}
				const response = await fetch(tokenEndpoint);
				const conversationInfo = await response.json();
				if (!conversationInfo.token) {
					throw new Error("Failed to get conversation token");
				}
				const newDirectLine = window.WebChat.createDirectLine({
					domain: `${directLineUrl}v3/directline`,
					token: conversationInfo.token,
				});
				const webchatElement = document.getElementById("webchat");
				window.WebChat.renderWebChat(
				{
					directLine: newDirectLine,
					styleOptions,
					store: createCustomStore(),
				},
				webchatElement
				);
				webChatInstance = newDirectLine;
			} catch (err) {
			console.error("Failed to restart conversation:", err);
			}
		}
		async function initializeChat() {
			try {
				const response = await fetch(regionalChannelSettingsURL);
				const data = await response.json();
				directLineUrl = data.channelUrlsById.directline;
				if (!directLineUrl) {
					throw new Error("Failed to get DirectLine URL");
				}
				const conversationResponse = await fetch(tokenEndpoint);
				const conversationInfo = await conversationResponse.json();
				if (!conversationInfo.token) {
					throw new Error("Failed to get conversation token");
				}
				const directLine = window.WebChat.createDirectLine({
				domain: `${directLineUrl}v3/directline`,
				token: conversationInfo.token,
				});
				window.WebChat.renderWebChat(
				{
					directLine,
					styleOptions,
					store: createCustomStore(),
				},
				document.getElementById("webchat")
				);
				webChatInstance = directLine;
			} catch (err) {
				console.error("Failed to initialize chat:", err);
			}
		}
	</script>
</head>
<body>
    <div id="chatbot-popup" role="complementary" aria-label="Chat Assistant">
		<div id="chatbot-header">
			<div class="header-title">
				<img class="chat-icon" src="./assets/img/ChatBot.png" alt="Chat Icon" width="48" height="35">
				<span class="header-title-text">Microsoft Demo ChatBot</span>
			</div>
			<div class="header-buttons">
				<button class="icon-button" id="restart-button" onclick="restartConversation()" aria-label="Restart Conversation">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="White" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
						<path d="M3 3v5h5"></path>
					</svg>
				</button>
				<button class="icon-button" id="close-button" onclick="hideChat()" aria-label="Close Chat">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="White" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<line x1="18" y1="6" x2="6" y2="18"></line>
						<line x1="6" y1="6" x2="18" y2="18"></line>
					</svg>
				</button>
			</div>
		</div>
		<div id="webchat" role="main"></div>
	</div>
    <button id="open-chat" onclick="showChat()" aria-label="Open Chat Assistant" class="">
		<svg viewBox="0 0 24 24" fill="none" stroke="White" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
		</svg>
	</button>
</body>
</html>
